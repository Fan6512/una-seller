[package]
name = "una-seller"
version = "0.7.0"
description = "Una Seller desktop"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri's generate_context! references serde_json when plugin configuration is embedded.
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2.14.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
