name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      desktop: ${{ steps.scope.outputs.desktop }}
      extension: ${{ steps.scope.outputs.extension }}
      persistence: ${{ steps.scope.outputs.persistence }}
    steps:
      - name: Check out repository (shallow)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Validate changed-file rules
        run: bash scripts/ci/test-scopes.sh
      - name: Determine affected modules
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git fetch --no-tags --depth=1 origin "$BASE_SHA" || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo 'Missing compare base: run all checks'
            printf 'backend=true\ndesktop=true\nextension=true\npersistence=true\n' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA" HEAD | bash scripts/ci/changed-scopes.sh >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  backend:
    name: Go Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: una_seller_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d una_seller_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/una_seller_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet, test and build
        run: |
          go vet ./...
          go test -p 1 ./...
          go build ./...

      - name: Seed PostgreSQL restart persistence fixture
        if: needs.changes.outputs.persistence == 'true'
        env:
          TEST_RESTART_PHASE: before
        run: go test -p 1 -count=1 -run '^TestPostgresProcessRestartPersistence$' ./internal/collections

      - name: Restart PostgreSQL 17 service container
        if: needs.changes.outputs.persistence == 'true'
        run: |
          container="${{ job.services.postgres.id }}"
          docker restart "$container"
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres -d una_seller_test >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$container"
            echo "PostgreSQL did not become ready after restart"
            exit 1
          fi

      - name: Verify PostgreSQL data after process restart
        if: needs.changes.outputs.persistence == 'true'
        env:
          TEST_RESTART_PHASE: after
        run: go test -p 1 -count=1 -run '^TestPostgresProcessRestartPersistence$' ./internal/collections

  desktop:
    name: Desktop Frontend
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify listing sync batch and resume behavior
        run: node --experimental-strip-types --test tests/listingBatches.test.mjs

      - name: Verify order workbench scope switching
        run: node --test tests/ordersScope.test.mjs

      - name: Verify product-box workflow decisions
        run: node --experimental-strip-types --test tests/workbenchRules.test.mjs

      - name: Verify editable listing field defaults and validation
        run: node --experimental-strip-types --test tests/listingFields.test.mjs

      - name: TypeScript check and Vite build
        run: npm run build

  extension:
    name: Browser Extension MV3
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/browser-extension
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Validate manifest, script syntax and parser
        run: |
          node --check amazon-core.js
          node --check content.js
          node --check background.js
          node --check popup.js
          node --test tests/*.test.cjs
      - name: Package extension ZIP
        id: package
        run: |
          version="$(node -p 'require("./manifest.json").version')"
          zip -9 "una-seller-extension-v${version}.zip" manifest.json amazon-core.js content.js content.css background.js popup.html popup.js popup.css README.md
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Upload installable extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: una-seller-extension-v${{ steps.package.outputs.version }}
          path: apps/browser-extension/una-seller-extension-v${{ steps.package.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14
