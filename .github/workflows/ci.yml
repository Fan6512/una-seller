name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: una_seller_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d una_seller_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/una_seller_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            # Temporary diagnostics for PR #23 only; revert after correcting formatting.
            gofmt -d ./internal/meli/refresh.go
            exit 1
          fi

      - name: Vet, test and build
        run: |
          go vet ./...
          go test -v -p 1 ./...
          go build ./...

      - name: Seed PostgreSQL restart persistence fixture
        env:
          TEST_RESTART_PHASE: before
        run: go test -v -p 1 -count=1 -run '^TestPostgresProcessRestartPersistence$' ./internal/collections

      - name: Restart PostgreSQL 17 service container
        run: |
          container="${{ job.services.postgres.id }}"
          docker restart "$container"
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres -d una_seller_test >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$container"
            echo "PostgreSQL did not become ready after restart"
            exit 1
          fi

      - name: Verify PostgreSQL data after process restart
        env:
          TEST_RESTART_PHASE: after
        run: go test -v -p 1 -count=1 -run '^TestPostgresProcessRestartPersistence$' ./internal/collections

  desktop:
    name: Desktop Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check and Vite build
        run: npm run build
