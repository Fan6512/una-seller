name: Windows Desktop Build

# Native packaging is a review/release gate, not an every-push check.
# Build only on Ready transition, manual dispatch, or protected release tags.
# If the candidate changes, rerun manually against the new HEAD.
on:
  pull_request:
    types: [ready_for_review]
    branches: [main]
    # CI/document-only PRs never need a Windows native installer.
    paths:
      - 'apps/desktop/**'
      - 'backend/**'
  workflow_dispatch:
    inputs:
      desktop_only:
        description: Build only the desktop installer
        type: boolean
        default: false
      signed_smoke:
        description: Build with an ephemeral key and loopback updater for testing
        type: boolean
        default: false
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.event_name == 'push' && 'release' || github.ref }}-${{ inputs.signed_smoke && 'signed-smoke' || 'default' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  production-environment:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require the production environment to exist before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/desktop-production" |
            jq -e 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length > 0))' > /dev/null

  build:
    needs: production-environment
    if: >-
      !cancelled() &&
      (github.event_name != 'push' || needs.production-environment.result == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    name: Windows Tauri x64 (NSIS)
    environment: ${{ github.event_name == 'push' && 'desktop-production' || 'desktop-ci' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Check release tag and versions
        if: github.event_name == 'push'
        run: |
          if ($env:RUNNER_ARCH -cne 'X64' -or $env:GITHUB_REF_NAME -cnotmatch '^desktop-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Expected a stable desktop-vMAJOR.MINOR.PATCH tag and an x64 runner.'
          }
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release commit must be on main.' }
          $version = $env:GITHUB_REF_NAME.Substring(9)
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          if ($version -cne $tauri -or $version -cne $npm -or $version -cne $cargo -or
              $version -cne $lock.version -or $version -cne $lock.packages[''].version) {
            throw 'The release tag and all desktop version files must match.'
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build test NSIS installer
        if: github.event_name != 'push' && !inputs.signed_smoke
        env:
          # QA installers use the artifact's separate loopback Go API. Never
          # send test product-box writes to the existing cloud production API.
          # Release-tag builds use their own signing step and remain cloud-based.
          VITE_API_BASE_URL: http://127.0.0.1:8787
          VITE_UNA_SELLER_DEV_DIAGNOSTICS: '1'
        run: npm run tauri:build -- --bundles nsis -- --locked

      - name: Build signed NSIS installer
        if: github.event_name == 'push' || inputs.signed_smoke
        env:
          SIGNED_SMOKE: ${{ inputs.signed_smoke }}
          UPDATER_PUBLIC_KEY: ${{ github.event_name == 'push' && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          $smoke = $env:SIGNED_SMOKE -eq 'true'
          $endpoint = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json"
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $key = Join-Path $env:RUNNER_TEMP 'desktop-smoke.key'
          $config = Join-Path $env:RUNNER_TEMP 'desktop-release.json'
          try {
            if ($smoke) {
              $endpoint = 'http://127.0.0.1:14218/latest.json'
              $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = [guid]::NewGuid().ToString('N')
              npm exec -- tauri signer generate --ci -w $key -p $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD *> $null
              if ($LASTEXITCODE -ne 0) { throw 'Could not generate ephemeral updater key.' }
              $env:TAURI_SIGNING_PRIVATE_KEY = $key
              $env:UPDATER_PUBLIC_KEY = Get-Content -LiteralPath "$key.pub" -Raw
            }
            if ([string]::IsNullOrWhiteSpace($env:UPDATER_PUBLIC_KEY) -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
              throw 'Configure the owner-approved updater key pair in desktop-production.'
            }
            $publicKey = $env:UPDATER_PUBLIC_KEY.Trim()
            @{
              bundle = @{ createUpdaterArtifacts = $true }
              plugins = @{ updater = @{
                pubkey = $publicKey
                requireSignedVersion = $true
                endpoints = @($endpoint)
                dangerousInsecureTransportProtocol = $smoke
              }}
            } | ConvertTo-Json -Depth 6 | Set-Content $config
            npm run tauri:build -- --bundles nsis --config $config -- --locked
            if ($LASTEXITCODE -ne 0) { throw 'Signed NSIS build failed.' }
          } finally {
            if ($smoke) {
              foreach ($file in @($key, "$key.pub")) {
                if (Test-Path -LiteralPath $file) { Remove-Item -LiteralPath $file }
              }
            }
          }
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*_x64-setup.exe)
          if ($installer.Count -ne 1 -or !(Test-Path -LiteralPath ($installer[0].FullName + '.sig') -PathType Leaf)) {
            throw 'Expected exactly one signed x64 NSIS installer.'
          }
          $payload = Join-Path $env:RUNNER_TEMP 'desktop-release'
          New-Item -ItemType Directory -Path $payload | Out-Null
          $asset = Join-Path $payload "Una-Seller_${version}_x64-setup.exe"
          Copy-Item -LiteralPath $installer[0].FullName -Destination $asset
          Copy-Item -LiteralPath ($installer[0].FullName + '.sig') -Destination ($asset + '.sig')
          Set-Content -Path (Join-Path $payload 'updater.pub.b64') -Value $publicKey -NoNewline
          if ($smoke) {
            Copy-Item src-tauri/target/release/una-seller.exe -Destination $payload
          }

      - name: Upload isolated signed smoke artifacts
        if: inputs.signed_smoke
        uses: actions/upload-artifact@v4
        with:
          name: una-seller-updater-smoke
          path: ${{ runner.temp }}/desktop-release/
          if-no-files-found: error
          retention-days: 1

      - name: Stage signed release assets
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: una-seller-signed-release
          path: ${{ runner.temp }}/desktop-release/
          if-no-files-found: error
          retention-days: 1

      - name: Set up Go for local API
        if: github.event_name != 'push' && !inputs.desktop_only && !inputs.signed_smoke
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Build local API for Windows
        if: github.event_name != 'push' && !inputs.desktop_only && !inputs.signed_smoke
        working-directory: backend
        run: go build -o ../apps/desktop/src-tauri/target/release/una-seller-api.exe ./cmd/api

      - name: Upload Windows app, installer and local API
        if: github.event_name != 'push' && !inputs.signed_smoke
        uses: actions/upload-artifact@v4
        with:
          name: una-seller-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/una-seller.exe
            apps/desktop/src-tauri/target/release/una-seller-api.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: github.event_name == 'push'
    needs: build
    name: Verify and stage GitHub Release draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: una-seller-signed-release
          path: release

      - name: Verify signature and prepare updater manifest
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y minisign
          installer=(*_x64-setup.exe)
          test "${#installer[@]}" -eq 1
          test -f "$installer"
          base64 --decode updater.pub.b64 > updater.pub
          base64 --decode "$installer.sig" > installer.minisig
          minisign -Vm "$installer" -p updater.pub -x installer.minisig

          previous_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$GITHUB_REF_NAME" --jq .body > release-notes.md
          version="${GITHUB_REF_NAME#desktop-v}"
          python - "$version" "$previous_tags" "$installer" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys
          from urllib.parse import quote

          version, previous_tags, installer = sys.argv[1:]
          prefix = "trusted comment:"
          signed_versions = [
              field.removeprefix("version:")
              for line in Path("installer.minisig").read_text(encoding="utf-8").splitlines()
              if line.startswith(prefix)
              for field in line.removeprefix(prefix).strip().split("\t")
              if field.startswith("version:")
          ]
          if signed_versions != [version]:
              sys.exit("Updater signature does not bind the release version")
          current = tuple(map(int, version.split(".")))
          for tag in previous_tags.splitlines():
              previous = re.fullmatch(r"desktop-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
              if previous and current <= tuple(map(int, previous.groups())):
                  sys.exit(f"Desktop version must exceed published {tag}")
          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          Path("latest.json").write_text(json.dumps({
              "version": version,
              "notes": Path("release-notes.md").read_text(encoding="utf-8").strip(),
              "platforms": {"windows-x86_64": {
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{quote(installer)}",
                  "signature": Path(installer + ".sig").read_text().strip(),
              }},
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Create Release draft for owner review
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Una Seller ${GITHUB_REF_NAME#desktop-v}" --notes-file release-notes.md \
            *_x64-setup.exe *_x64-setup.exe.sig latest.json
