name: Windows Desktop Build

# Native packaging is a review/release gate, not an every-push check.
# After a Ready PR receives more commits, rerun manually against its branch.
on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Windows Tauri x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build native app and NSIS installer
        run: npm run tauri:build -- --bundles nsis

      - name: Set up Go for local API
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Build local API for Windows
        working-directory: backend
        run: go build -o ../apps/desktop/src-tauri/target/release/una-seller-api.exe ./cmd/api

      - name: Upload Windows app, installer and local API
        uses: actions/upload-artifact@v4
        with:
          name: una-seller-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/una-seller.exe
            apps/desktop/src-tauri/target/release/una-seller-api.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
