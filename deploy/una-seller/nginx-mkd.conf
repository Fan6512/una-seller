# Install only AFTER mkd.186512.xyz has a valid Let's Encrypt certificate.
# Always back up and inspect the existing Nginx configuration before enabling.
server {
    listen 80;
    server_name mkd.186512.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mkd.186512.xyz;

    ssl_certificate /etc/letsencrypt/live/mkd.186512.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mkd.186512.xyz/privkey.pem;

    client_max_body_size 1m;

    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/v1/collections {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
    }

    # Never include the OAuth authorization code/state in Nginx access logs.
    location = /api/v1/mercadolibre/oauth/callback {
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location ^~ /api/v1/stores {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
